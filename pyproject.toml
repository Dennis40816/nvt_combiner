[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvt-combiner"
dynamic = ["version"]
description = "Compatibility-first Python rewrite of the Novatek legacy Combiner"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
combiner = "nvt_combiner.cli:main"
nvt-combiner-postbuild = "nvt_combiner.postbuild:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "nvt_combiner.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
